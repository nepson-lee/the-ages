// 時空之門 前後端即時協定（WebSocket 二進位訊息）。
// 修改後：伺服器端由 Maven 重新產生 Java；前端執行 `npm run gen` 重新產生 TypeScript。
// 相容性規則：已發佈的欄位編號不可重用或改型別，刪除欄位請改用 reserved。
syntax = "proto3";

package theages.v1;

option java_package = "com.theages.protocol.v1";
option java_multiple_files = true;

// 地面座標（世界單位為公尺，Y 軸朝上，玩家移動在 XZ 平面）。
message Vec2 {
  float x = 1;
  float z = 2;
}

// ===== Client → Server =====

message ClientMessage {
  oneof payload {
    MoveTo move_to = 1;
    Command command = 2;
    Attack attack = 3;
  }
}

// 點擊地面移動：伺服器負責實際位移，客戶端只表達意圖。移動會中止自己發起的攻擊。
message MoveTo {
  Vec2 target = 1;
}

// 點擊 NPC 攻擊，等同 `kill <目標>` 指令。
message Attack {
  uint32 target_id = 1;
}

// MUD 風格文字指令，例如 "say 大家好"、"look"、"who"。
message Command {
  string text = 1;
}

// ===== Server → Client =====

message ServerMessage {
  oneof payload {
    Welcome welcome = 1;
    WorldSnapshot snapshot = 2;
    EntityLeft entity_left = 3;
    TextOutput text = 4;
    CombatEvent combat = 5;
    SelfStats self_stats = 6;
    Inventory inventory = 7;
    ShopView shop = 8;
    ShopClosed shop_closed = 9;
  }
}

// 進入區域時送出（包括從別的區域傳送過來）。客戶端收到時應清空場景、依 zone_id 重建地形。
message Welcome {
  uint32 self_id = 1;
  string zone_id = 2;
  string zone_name = 3;
  uint32 tick_rate = 4;
  float zone_size = 5;
}

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_PLAYER = 1;
  ENTITY_KIND_NPC = 2;
  // 地上的物品：model 為物品模板 id；點擊後送出 `get #<id>` 指令撿起。
  ENTITY_KIND_ITEM = 3;
  // 商人：不能攻擊；點擊後送出 `list #<id>` 指令打開商店。
  ENTITY_KIND_MERCHANT = 4;
  // 區域出口：model 為 "portal"；點擊後送出 `go #<id>` 指令前往。
  ENTITY_KIND_PORTAL = 5;
}

message EntityState {
  uint32 id = 1;
  string name = 2;
  EntityKind kind = 3;
  Vec2 position = 4;
  uint32 level = 5;
  uint32 hp = 6;
  uint32 max_hp = 7;
  // 正在攻擊的對象，0 = 沒有。
  uint32 target_id = 8;
  // 外觀代碼：NPC 為模板 id（例如 "rabbit"），玩家為 "player"。
  string model = 9;
}

// full = true 時為完整快照（剛進入區域），否則只包含本 tick 有變動的實體。
message WorldSnapshot {
  uint64 tick = 1;
  bool full = 2;
  repeated EntityState entities = 3;
}

message EntityLeft {
  uint32 id = 1;
}

enum TextChannel {
  TEXT_CHANNEL_UNSPECIFIED = 0;
  TEXT_CHANNEL_SYSTEM = 1;
  TEXT_CHANNEL_SAY = 2;
  TEXT_CHANNEL_ROOM = 3;
}

message TextOutput {
  TextChannel channel = 1;
  string text = 2;
}

// 一次攻擊的結果，廣播給區域內所有人（用來顯示傷害數字）。文字敘述只送給當事人。
message CombatEvent {
  uint32 attacker_id = 1;
  uint32 target_id = 2;
  uint32 damage = 3;
  bool miss = 4;
  bool killed = 5;
}

// 自己的角色數值，變動時才送。
message SelfStats {
  uint32 level = 1;
  uint32 exp = 2;
  uint32 exp_to_next = 3;
  uint32 hp = 4;
  uint32 max_hp = 5;
  uint32 attack = 6;
  uint32 defense = 7;
  uint32 gold = 8;
}

enum ItemType {
  ITEM_TYPE_UNSPECIFIED = 0;
  ITEM_TYPE_EQUIPMENT = 1;
  ITEM_TYPE_CONSUMABLE = 2;
  ITEM_TYPE_MISC = 3;
}

enum EquipSlot {
  EQUIP_SLOT_UNSPECIFIED = 0;
  EQUIP_SLOT_WEAPON = 1;
  EQUIP_SLOT_HEAD = 2;
  EQUIP_SLOT_BODY = 3;
  EQUIP_SLOT_FEET = 4;
}

// 背包中的一格。uid 在同一次連線內穩定，指令可用 `#<uid>` 指定（例如 `wear #3`）。
message InventoryItem {
  uint32 uid = 1;
  string template_id = 2;
  string name = 3;
  string description = 4;
  uint32 quantity = 5;
  ItemType type = 6;
  EquipSlot slot = 7;
  bool equipped = 8;
  int32 attack = 9;
  int32 defense = 10;
  int32 max_hp = 11;
  // 消耗品使用後回復的生命。
  int32 heal = 12;
}

// 完整的背包內容，變動時整份重送（最多 capacity 格，資料量很小）。
message Inventory {
  repeated InventoryItem items = 1;
  uint32 capacity = 2;
}

// 商店畫面。打開商店、或在商店開著時背包有變動，都會整份重送。
message ShopView {
  uint32 merchant_id = 1;
  string merchant_name = 2;
  string shop_name = 3;
  repeated ShopOffer offers = 4;
  // 背包中商人願意收購的物品與單價（不收購的不列出）。
  repeated SellQuote quotes = 5;
}

// 商人販賣的物品。購買指令：`buy <template_id> [數量]`。
message ShopOffer {
  string template_id = 1;
  string name = 2;
  string description = 3;
  uint32 price = 4;
  ItemType type = 5;
  EquipSlot slot = 6;
  int32 attack = 7;
  int32 defense = 8;
  int32 max_hp = 9;
  int32 heal = 10;
}

// 出售指令：`sell #<uid> [數量|all]`。
message SellQuote {
  uint32 uid = 1;
  uint32 price = 2;
}

// 離開商人太遠或商人消失時送出，前端關閉商店畫面。
message ShopClosed {
}
