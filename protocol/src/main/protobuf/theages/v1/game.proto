// 時空之門 前後端即時協定（WebSocket 二進位訊息）。
// 修改後：伺服器端由 Maven 重新產生 Java；前端執行 `npm run gen` 重新產生 TypeScript。
// 相容性規則：已發佈的欄位編號不可重用或改型別，刪除欄位請改用 reserved。
syntax = "proto3";

package theages.v1;

option java_package = "com.theages.protocol.v1";
option java_multiple_files = true;

// 地面座標（世界單位為公尺，Y 軸朝上，玩家移動在 XZ 平面）。
message Vec2 {
  float x = 1;
  float z = 2;
}

// ===== Client → Server =====

message ClientMessage {
  oneof payload {
    MoveTo move_to = 1;
    Command command = 2;
    Attack attack = 3;
  }
}

// 點擊地面移動：伺服器負責實際位移，客戶端只表達意圖。移動會中止自己發起的攻擊。
message MoveTo {
  Vec2 target = 1;
}

// 點擊 NPC 攻擊，等同 `kill <目標>` 指令。
message Attack {
  uint32 target_id = 1;
}

// MUD 風格文字指令，例如 "say 大家好"、"look"、"who"。
message Command {
  string text = 1;
}

// ===== Server → Client =====

message ServerMessage {
  oneof payload {
    Welcome welcome = 1;
    WorldSnapshot snapshot = 2;
    EntityLeft entity_left = 3;
    TextOutput text = 4;
    CombatEvent combat = 5;
    SelfStats self_stats = 6;
    Inventory inventory = 7;
    ShopView shop = 8;
    ShopClosed shop_closed = 9;
    PartyView party = 10;
    QuestLog quest_log = 11;
    QuestDialog quest_dialog = 12;
    QuestMarkers quest_markers = 13;
    SkillBook skill_book = 14;
  }
}

// 進入區域時送出（包括從別的區域傳送過來）。客戶端收到時應清空場景、依 zone_id 重建地形。
message Welcome {
  uint32 self_id = 1;
  string zone_id = 2;
  string zone_name = 3;
  uint32 tick_rate = 4;
  float zone_size = 5;
}

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_PLAYER = 1;
  ENTITY_KIND_NPC = 2;
  // 地上的物品：model 為物品模板 id；點擊後送出 `get #<id>` 指令撿起。
  ENTITY_KIND_ITEM = 3;
  // 商人：不能攻擊；點擊後送出 `list #<id>` 指令打開商店。
  ENTITY_KIND_MERCHANT = 4;
  // 區域出口：model 為 "portal"；點擊後送出 `go #<id>` 指令前往。
  ENTITY_KIND_PORTAL = 5;
  // 友善 NPC（例如發任務的村長）：不能攻擊；點擊後送出 `talk #<id>`。商人點擊後也送 talk。
  ENTITY_KIND_FRIENDLY = 6;
}

message EntityState {
  uint32 id = 1;
  string name = 2;
  EntityKind kind = 3;
  Vec2 position = 4;
  uint32 level = 5;
  uint32 hp = 6;
  uint32 max_hp = 7;
  // 正在攻擊的對象，0 = 沒有。
  uint32 target_id = 8;
  // 外觀代碼：NPC 為模板 id（例如 "rabbit"），玩家為 "player"。
  string model = 9;
}

// full = true 時為完整快照（剛進入區域），否則只包含本 tick 有變動的實體。
message WorldSnapshot {
  uint64 tick = 1;
  bool full = 2;
  repeated EntityState entities = 3;
}

message EntityLeft {
  uint32 id = 1;
}

enum TextChannel {
  TEXT_CHANNEL_UNSPECIFIED = 0;
  TEXT_CHANNEL_SYSTEM = 1;
  TEXT_CHANNEL_SAY = 2;
  TEXT_CHANNEL_ROOM = 3;
  // 隊伍頻道：隊伍聊天與組隊通知，跨區域也收得到。
  TEXT_CHANNEL_PARTY = 4;
}

message TextOutput {
  TextChannel channel = 1;
  string text = 2;
}

// 一次攻擊的結果，廣播給區域內所有人（用來顯示傷害數字）。文字敘述只送給當事人。
message CombatEvent {
  uint32 attacker_id = 1;
  uint32 target_id = 2;
  uint32 damage = 3;
  bool miss = 4;
  bool killed = 5;
  // 技能造成的效果時為技能名稱（顯示在數字旁邊）。
  string skill_name = 6;
  // true = 治療：damage 是回復量。
  bool heal = 7;
}

// 自己的角色數值，變動時才送。
message SelfStats {
  uint32 level = 1;
  uint32 exp = 2;
  uint32 exp_to_next = 3;
  uint32 hp = 4;
  uint32 max_hp = 5;
  uint32 attack = 6;
  uint32 defense = 7;
  uint32 gold = 8;
  // 內力：施放技能消耗。
  uint32 mp = 9;
  uint32 max_mp = 10;
}

enum ItemType {
  ITEM_TYPE_UNSPECIFIED = 0;
  ITEM_TYPE_EQUIPMENT = 1;
  ITEM_TYPE_CONSUMABLE = 2;
  ITEM_TYPE_MISC = 3;
}

enum EquipSlot {
  EQUIP_SLOT_UNSPECIFIED = 0;
  EQUIP_SLOT_WEAPON = 1;
  EQUIP_SLOT_HEAD = 2;
  EQUIP_SLOT_BODY = 3;
  EQUIP_SLOT_FEET = 4;
}

// 背包中的一格。uid 在同一次連線內穩定，指令可用 `#<uid>` 指定（例如 `wear #3`）。
message InventoryItem {
  uint32 uid = 1;
  string template_id = 2;
  string name = 3;
  string description = 4;
  uint32 quantity = 5;
  ItemType type = 6;
  EquipSlot slot = 7;
  bool equipped = 8;
  int32 attack = 9;
  int32 defense = 10;
  int32 max_hp = 11;
  // 消耗品使用後回復的生命。
  int32 heal = 12;
}

// 完整的背包內容，變動時整份重送（最多 capacity 格，資料量很小）。
message Inventory {
  repeated InventoryItem items = 1;
  uint32 capacity = 2;
}

// 商店畫面。打開商店、或在商店開著時背包有變動，都會整份重送。
message ShopView {
  uint32 merchant_id = 1;
  string merchant_name = 2;
  string shop_name = 3;
  repeated ShopOffer offers = 4;
  // 背包中商人願意收購的物品與單價（不收購的不列出）。
  repeated SellQuote quotes = 5;
}

// 商人販賣的物品。購買指令：`buy <template_id> [數量]`。
message ShopOffer {
  string template_id = 1;
  string name = 2;
  string description = 3;
  uint32 price = 4;
  ItemType type = 5;
  EquipSlot slot = 6;
  int32 attack = 7;
  int32 defense = 8;
  int32 max_hp = 9;
  int32 heal = 10;
}

// 出售指令：`sell #<uid> [數量|all]`。
message SellQuote {
  uint32 uid = 1;
  uint32 price = 2;
}

// 離開商人太遠或商人消失時送出，前端關閉商店畫面。
message ShopClosed {
}

// 隊伍狀態，成員或成員數值變動時整份重送。members 為空 = 不在隊伍中。
message PartyView {
  repeated PartyMember members = 1;
}

message PartyMember {
  string name = 1;
  uint32 level = 2;
  uint32 hp = 3;
  uint32 max_hp = 4;
  string zone_name = 5;
  bool leader = 6;
  // 自己，方便客戶端標示。
  bool self = 7;
}

// ===== 任務 =====

// 自己進行中的任務，變動時整份重送。
message QuestLog {
  repeated QuestEntry quests = 1;
}

message QuestEntry {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated QuestObjective objectives = 4;
  // 所有目標都完成，可以回報了。
  bool ready = 5;
  // 要找誰交任務。
  string turn_in_name = 6;
  string rewards = 7;
}

message QuestObjective {
  string text = 1;
  uint32 current = 2;
  uint32 required = 3;
}

// 和 NPC 對話時送出：這位 NPC 能給的、或能交給他的任務。
// 按鈕指令：`quest accept <id>`、`quest complete <id>`、`quest abandon <id>`。
message QuestDialog {
  uint32 npc_id = 1;
  string npc_name = 2;
  string greeting = 3;
  repeated QuestOffer offers = 4;
}

enum QuestOfferStatus {
  QUEST_OFFER_STATUS_UNSPECIFIED = 0;
  QUEST_OFFER_STATUS_AVAILABLE = 1;
  QUEST_OFFER_STATUS_IN_PROGRESS = 2;
  QUEST_OFFER_STATUS_READY = 3;
}

message QuestOffer {
  string id = 1;
  string name = 2;
  string description = 3;
  QuestOfferStatus status = 4;
  string objectives = 5;
  string rewards = 6;
}

// NPC 頭上的任務標記，每位玩家各自不同（依自己的任務進度），變動時整份重送。
message QuestMarkers {
  repeated QuestMarker markers = 1;
}

enum QuestMarkerKind {
  QUEST_MARKER_KIND_UNSPECIFIED = 0;
  // 「!」：有任務可以接。
  QUEST_MARKER_KIND_AVAILABLE = 1;
  // 「?」：有任務可以交。
  QUEST_MARKER_KIND_READY = 2;
}

message QuestMarker {
  uint32 entity_id = 1;
  QuestMarkerKind kind = 2;
}

// ===== 技能 =====

enum SkillType {
  SKILL_TYPE_UNSPECIFIED = 0;
  // 單體攻擊：打目前的戰鬥對象。
  SKILL_TYPE_STRIKE = 1;
  // 範圍攻擊：打身邊所有敵人。
  SKILL_TYPE_AOE = 2;
  // 治療：自己或指定的玩家。
  SKILL_TYPE_HEAL = 3;
  // 增益：一段時間內提升攻擊或防禦。
  SKILL_TYPE_BUFF = 4;
}

// 自己已學會的技能（技能列），以及附近訓練師能教的技能。
// 學會、施放、升級、靠近或離開訓練師時整份重送。施放指令：`cast <id>`；學習：`learn <id>`。
message SkillBook {
  repeated SkillInfo known = 1;
  repeated SkillInfo learnable = 2;
  // 附近的訓練師名稱；空 = 附近沒有訓練師。
  string trainer_name = 3;
}

message SkillInfo {
  string id = 1;
  string name = 2;
  string description = 3;
  SkillType type = 4;
  uint32 mp_cost = 5;
  uint32 cooldown_ms = 6;
  // 送出當下還要等多久才能再施放。
  uint32 remaining_ms = 7;
  uint32 level = 8;
  uint32 price = 9;
  // learnable 專用：false 時 reason 說明為什麼還不能學。
  bool can_learn = 10;
  string reason = 11;
}
