spring:
  application:
    name: the-ages-server
  config:
    # 遊戲內容（區域、NPC）與程式設定分開，企劃改內容不必動這個檔
    import: classpath:world/content.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/theages
    username: theages
    password: theages
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      # 需要 Java 21 以上才會生效；升級 JDK 後改成 true。
      enabled: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

theages:
  jwt:
    # 開發用金鑰（Base64，至少 32 bytes）。正式環境務必用環境變數 THEAGES_JWT_SECRET 覆寫。
    secret: ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==
    ttl: 12h
  websocket:
    allowed-origins:
      - http://localhost:5173
  world:
    tick-rate: 10
