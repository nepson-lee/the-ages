spring:
  application:
    name: the-ages-server
  config:
    # 遊戲內容（區域、NPC）與程式設定分開，企劃改內容不必動這個檔
    import: classpath:world/content.yml
  datasource:
    url: jdbc:postgresql://localhost:5432/theages
    username: theages
    password: theages
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  threads:
    virtual:
      # 需要 Java 21 以上才會生效；升級 JDK 後改成 true。
      enabled: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

theages:
  jwt:
    # 開發用金鑰（Base64，至少 32 bytes）。正式環境務必用環境變數 THEAGES_JWT_SECRET 覆寫。
    secret: ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==
    ttl: 12h
  websocket:
    allowed-origins:
      - http://localhost:5173
  # 每條連線的訊息頻率限制（權杖桶）：burst = 最多連續幾則，per-second = 長時間平均每秒幾則
  rate-limit:
    move: { burst: 10, per-second: 5 }
    attack: { burst: 5, per-second: 2 }
    # 文字指令含聊天、技能、背包與商店按鈕；最嚴格，主要用來擋洗頻
    command: { burst: 8, per-second: 2 }
    notice-interval: 3s
    # 10 秒內被擋 50 次視為惡意洗頻，直接斷線
    abuse-window: 10s
    abuse-rejections: 50
    max-message-bytes: 4096
  world:
    tick-rate: 10
