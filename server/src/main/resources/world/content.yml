# 遊戲內容。座標單位為公尺，區域中心為原點。
theages:
  world:
    starting-zone: newbie-village

    # 新角色出生時身上的物品（裝備類會自動穿上）
    starting-items: [wooden-sword, cloth-shirt]
    starting-gold: 30

    # 物品模板。
    #   type        equipment（裝備）、consumable（消耗品）、misc（材料雜物）
    #   slot        裝備欄位：weapon、head、body、feet
    #   heal        消耗品使用後回復的生命
    #   mana        消耗品使用後回復的內力
    #   value       物品價值（銅錢）：商店售價預設為 value，收購價為 value × 商店的 buy-rate
    #   max-stack   同一格最多疊幾個（裝備固定 1，其他預設 20）
    item-templates:
      - id: wooden-sword
        name: 木劍
        keywords: [sword]
        description: 一把用老橡木削成的練習劍，劍身上還留著刀痕。
        type: equipment
        value: 6
        slot: weapon
        attack: 2
      - id: cloth-shirt
        name: 布衣
        keywords: [shirt, cloth]
        description: 粗麻布縫製的上衣，穿起來有點刺刺的。
        type: equipment
        value: 4
        slot: body
        defense: 1
      - id: wolf-fang-dagger
        name: 狼牙匕首
        keywords: [dagger]
        description: 以狼牙磨成的短刃，鋒利得能劃開皮革。
        type: equipment
        value: 60
        slot: weapon
        attack: 6
      - id: wolf-pelt-vest
        name: 狼皮背心
        keywords: [vest]
        description: 用整張狼皮縫成的背心，厚實又保暖。
        type: equipment
        value: 80
        slot: body
        defense: 4
        max-hp: 10
      - id: leather-cap
        name: 皮帽
        keywords: [cap, hat]
        description: 一頂簡單的皮帽，能擋住從樹上掉下來的松果。
        type: equipment
        value: 35
        slot: head
        defense: 2
      - id: straw-sandals
        name: 草鞋
        keywords: [sandals, shoes]
        description: 稻草編成的草鞋，走起路來沙沙作響。
        type: equipment
        value: 14
        slot: feet
        defense: 1
        max-hp: 5
      - id: rabbit-meat
        name: 兔肉
        keywords: [meat]
        description: 一塊新鮮的兔肉，烤一烤應該很香。
        type: consumable
        value: 4
        heal: 15
      - id: egg
        name: 雞蛋
        keywords: [egg]
        description: 一顆還帶著餘溫的雞蛋。
        type: consumable
        value: 3
        heal: 8
      - id: rabbit-fur
        name: 兔毛
        keywords: [fur]
        description: 一撮柔軟的兔毛，村裡的裁縫也許用得上。
        type: misc
        value: 6
      - id: feather
        name: 雞毛
        keywords: [feather]
        description: 一根雞毛，拿來搔癢剛剛好。
        type: misc
        value: 2
      - id: wolf-pelt
        name: 狼皮
        keywords: [pelt]
        description: 一張粗硬的灰色狼皮。
        type: misc
        value: 24
      - id: herb
        name: 止血草
        keywords: [herb]
        description: 一把曬乾的止血草，嚼一嚼可以止住小傷口的血。
        type: consumable
        value: 10
        heal: 25
      - id: wound-salve
        name: 金創藥
        keywords: [salve, potion]
        description: 一小罐氣味刺鼻的藥膏，行走江湖的人身上總會帶上幾罐。
        type: consumable
        value: 30
        heal: 60
      - id: qi-pill
        name: 回氣丹
        keywords: [pill, qi]
        description: 一顆褐色的小藥丸，吞下去丹田就暖了起來。
        type: consumable
        value: 20
        mana: 40
      # --- 黑松林 ---
      - id: spider-silk
        name: 蜘蛛絲
        keywords: [silk]
        description: 一團黏呼呼又堅韌的蜘蛛絲，裁縫很喜歡用它來縫皮甲。
        type: misc
        value: 12
      - id: boar-tusk
        name: 山豬獠牙
        keywords: [tusk]
        description: 一根彎曲的獠牙，尖端還沾著泥土。
        type: misc
        value: 20
      - id: boar-meat
        name: 山豬肉
        keywords: [pork]
        description: 一大塊帶著肥油的山豬肉，烤起來滋滋作響。
        type: consumable
        value: 8
        heal: 35
      - id: bear-pelt
        name: 熊皮
        keywords: [bearskin]
        description: 一整張厚重的黑熊皮，能賣個好價錢。
        type: misc
        value: 90
      - id: hunting-knife
        name: 獵刀
        keywords: [knife]
        description: 刀背厚實的獵刀，剝皮、劈柴、砍狼都很順手。
        type: equipment
        slot: weapon
        value: 150
        attack: 11
      - id: hunter-leather
        name: 獵人皮甲
        keywords: [leather, armor]
        description: 以狼皮和蜘蛛絲縫製的皮甲，輕巧又耐用。
        type: equipment
        slot: body
        value: 220
        defense: 7
        max-hp: 20
      - id: leather-boots
        name: 皮靴
        keywords: [boots]
        description: 鞋底釘了鐵片的皮靴，走在泥濘的林道上也不怕。
        type: equipment
        slot: feet
        value: 90
        defense: 3
        max-hp: 10
      - id: bear-fur-hat
        name: 熊皮帽
        keywords: [furhat]
        description: 用熊皮做的大帽子，戴上去整個人看起來壯了一圈。
        type: equipment
        slot: head
        value: 160
        defense: 5
        max-hp: 15

    # 商店：由商人 NPC 的 shop 欄位引用。
    #   buy-rate    收購價 = 物品 value × buy-rate（至少 1 枚）
    #   buys        收購的物品類型；想讓商人也收裝備就加上 equipment
    #   sells       販賣的物品；price 可覆寫售價，未指定時為物品 value
    shops:
      - id: general-store
        name: 陳記雜貨
        buy-rate: 0.5
        buys: [misc]
        sells:
          - { item: herb }
          - { item: wound-salve }
          - { item: qi-pill }
          - { item: wooden-sword }
          - { item: straw-sandals, price: 20 }

      - id: hunter-lodge
        name: 獵人小屋
        buy-rate: 0.6
        buys: [misc, equipment]   # 獵人什麼都收，價格也比雜貨店好
        sells:
          - { item: wound-salve }
          - { item: qi-pill }
          - { item: hunting-knife }
          - { item: hunter-leather }
          - { item: leather-boots }

    # NPC 模板：同一模板可以在多個區域重複放置。
    #   keywords        kill/look 指令可用的英文代稱（MUD 傳統）
    #   verb            攻擊時的敘述動詞，例如「野狼撲咬了你」
    #   aggressive      true = 玩家靠近時主動攻擊
    #   wander-radius   閒晃時離出生點的最遠距離
    #   loot            掉寶表：每列獨立擲骰，chance 為 0～1 的機率，min/max 為數量
    #   gold-min/max    擊殺後搜出的銅錢（直接進玩家口袋）
    #   shop            有值的 NPC 是商人：不能攻擊，點擊會打開商店
    #   friendly        友善 NPC（例如發任務的村長）：不能攻擊，點擊是對話
    #   greeting        對話時說的話
    npc-templates:
      - id: rabbit
        name: 野兔
        keywords: [rabbit]
        description: 一隻毛茸茸的灰色野兔，耳朵不停地抖動。
        level: 1
        max-hp: 18
        attack: 4
        defense: 0
        exp: 12
        speed: 3.5
        verb: 咬了
        aggressive: false
        respawn-seconds: 15
        wander-radius: 5
        gold-min: 0
        gold-max: 2
        loot:
          - { item: rabbit-meat, chance: 0.6 }
          - { item: rabbit-fur, chance: 0.4, min: 1, max: 2 }
          - { item: straw-sandals, chance: 0.04 }

      - id: chicken
        name: 老母雞
        keywords: [chicken, hen]
        description: 一隻肥嘟嘟的老母雞，咕咕咕地在地上啄著米粒。
        level: 1
        max-hp: 12
        attack: 2
        defense: 0
        exp: 6
        speed: 2.5
        verb: 啄了
        aggressive: false
        respawn-seconds: 10
        wander-radius: 4
        gold-min: 0
        gold-max: 1
        loot:
          - { item: egg, chance: 0.5, min: 1, max: 2 }
          - { item: feather, chance: 0.5, min: 1, max: 3 }
          - { item: straw-sandals, chance: 0.05 }

      - id: wolf
        name: 野狼
        keywords: [wolf]
        description: 一頭眼神兇狠的灰狼，嘴邊還掛著口水，正虎視眈眈地盯著你。
        level: 3
        max-hp: 55
        attack: 11
        defense: 3
        exp: 40
        speed: 4.5
        verb: 撲咬了
        aggressive: true
        respawn-seconds: 30
        wander-radius: 6
        gold-min: 4
        gold-max: 10
        loot:
          - { item: wolf-pelt, chance: 0.5 }
          - { item: wolf-fang-dagger, chance: 0.15 }
          - { item: wolf-pelt-vest, chance: 0.1 }
          - { item: leather-cap, chance: 0.1 }

      - id: spider
        name: 毒蜘蛛
        keywords: [spider]
        description: 一隻拳頭大的黑色蜘蛛，背上有血紅色的花紋。
        level: 4
        max-hp: 45
        attack: 14
        defense: 2
        exp: 55
        speed: 3.5
        verb: 螫了
        aggressive: true
        respawn-seconds: 25
        wander-radius: 4
        gold-min: 2
        gold-max: 6
        loot:
          - { item: spider-silk, chance: 0.6, min: 1, max: 2 }
          - { item: wound-salve, chance: 0.05 }

      - id: boar
        name: 山豬
        keywords: [boar]
        description: 一頭壯碩的山豬，正用鼻子拱著地上的落葉，獠牙閃著寒光。
        level: 5
        max-hp: 95
        attack: 16
        defense: 5
        exp: 85
        speed: 4
        verb: 用獠牙頂了
        aggressive: false
        respawn-seconds: 30
        wander-radius: 6
        gold-min: 3
        gold-max: 9
        loot:
          - { item: boar-meat, chance: 0.7 }
          - { item: boar-tusk, chance: 0.4 }
          - { item: leather-boots, chance: 0.05 }

      - id: black-bear
        name: 黑熊
        keywords: [bear]
        description: 一頭像小山一樣的黑熊，胸前有一道月牙形的白毛。牠站起來比你高出兩個頭。
        level: 8
        max-hp: 280
        attack: 26
        defense: 9
        exp: 320
        speed: 4.2
        verb: 一掌拍中了
        aggressive: true
        respawn-seconds: 120
        wander-radius: 5
        gold-min: 20
        gold-max: 45
        loot:
          - { item: bear-pelt, chance: 1.0 }
          - { item: bear-fur-hat, chance: 0.25 }
          - { item: hunting-knife, chance: 0.1 }

      - id: hunter-li
        name: 獵人老李
        keywords: [li, hunter]
        description: 滿臉鬍渣的老獵人，背著一把舊弓，腰間掛著好幾張剛剝下來的皮。
        level: 15
        max-hp: 999
        attack: 0
        defense: 0
        exp: 0
        speed: 0
        verb: 拍了拍
        aggressive: false
        respawn-seconds: 10
        wander-radius: 0
        shop: hunter-lodge
        greeting: 林子裡的東西可不像村裡的雞那麼好欺負，小心點。

      - id: village-elder
        name: 村長
        keywords: [elder, chief]
        description: 白髮蒼蒼的老村長，拄著一根磨得發亮的竹杖，眼神卻很銳利。
        level: 20
        max-hp: 999
        attack: 0
        defense: 0
        exp: 0
        speed: 0
        verb: 敲了敲
        aggressive: false
        respawn-seconds: 10
        wander-radius: 0
        friendly: true
        greeting: 年輕人，新手村雖小，要幫忙的事可不少。

      - id: shopkeeper-chen
        name: 陳老闆
        keywords: [chen, shopkeeper, merchant]
        description: 雜貨店的陳老闆，圓圓的臉上總是掛著笑，算盤打得比誰都快。
        level: 10
        max-hp: 999
        attack: 0
        defense: 0
        exp: 0
        speed: 0
        verb: 拍了拍
        aggressive: false
        respawn-seconds: 10
        wander-radius: 0
        shop: general-store
        greeting: 要買點什麼嗎？止血草、金創藥，出門在外少不了的！

    # 任務：由 friendly 或商人 NPC 發出。
    #   giver / turn-in   發任務與交任務的 NPC（turn-in 不填 = giver）；交給別人就是送信任務
    #   level             最低等級
    #   requires          必須先完成的任務
    #   objectives        { kill: <NPC 模板>, count: N } 或 { collect: <物品>, count: N }（收集的物品交任務時收走）
    #   rewards           exp、gold、items: [{ item, count }]
    #   repeatable        完成後可以再接
    quests:
      - id: chicken-trouble
        name: 雞飛狗跳
        giver: village-elder
        description: 村裡的老母雞到處亂跑，把菜園啄得亂七八糟。幫村長教訓牠們一下吧。
        objectives:
          - { kill: chicken, count: 3 }
        rewards: { exp: 40, gold: 15, items: [{ item: herb, count: 2 }] }
        accept-text: 那幾隻老母雞就在村子西邊，別讓牠們再糟蹋菜園了。
        complete-text: 好、好！菜園總算可以清靜幾天了。這幾株止血草你收著。

      - id: winter-fur
        name: 兔毛換冬衣
        giver: village-elder
        requires: [chicken-trouble]
        description: 冬天快到了，村長想替村裡的孩子縫幾件暖和的衣服，需要一些兔毛。
        objectives:
          - { collect: rabbit-fur, count: 3 }
        rewards: { exp: 70, gold: 25, items: [{ item: straw-sandals }] }
        accept-text: 村外的野兔身上就有。三份兔毛應該夠縫一件了。
        complete-text: 這下孩子們不怕冷了。這雙草鞋雖然簡陋，走路倒是挺舒服的。

      - id: wolf-menace
        name: 狼患
        giver: village-elder
        level: 3
        requires: [winter-fur]
        description: 村外的野狼越來越大膽，已經有村民被咬傷了。
        objectives:
          - { kill: wolf, count: 3 }
        rewards: { exp: 160, gold: 50, items: [{ item: wolf-fang-dagger }] }
        accept-text: 村子東南邊和北邊的黑松林都有狼。千萬小心，打不過就跑。
        complete-text: 你是新手村的英雄！這把狼牙匕首是我年輕時用的，送你了。

      - id: letter-to-li
        name: 給獵人的信
        giver: village-elder
        turn-in: hunter-li
        level: 3
        requires: [winter-fur]
        description: 村長有封信要交給住在黑松林入口的獵人老李。
        rewards: { exp: 60, gold: 10 }
        accept-text: 從村子北邊的小徑一直走，就能到黑松林。老李就住在林道入口。
        complete-text: 喔？村長的信啊……林子裡最近不太平，正好需要你這樣的幫手。

      - id: spider-silk-order
        name: 蛛絲訂單
        giver: hunter-li
        requires: [letter-to-li]
        description: 老李要縫製新的皮甲，需要堅韌的蜘蛛絲。
        objectives:
          - { collect: spider-silk, count: 4 }
        rewards: { exp: 220, gold: 40, items: [{ item: wound-salve, count: 2 }] }
        accept-text: 毒蜘蛛在林子東西兩邊結網。被螫了記得吃藥。
        complete-text: 好絲！夠我縫好幾件皮甲了。

      - id: boar-feast
        name: 山豬肉宴
        giver: hunter-li
        level: 4
        requires: [letter-to-li]
        description: 山豬把老李的陷阱都拱壞了。順便打點肉回來加菜。
        objectives:
          - { kill: boar, count: 3 }
          - { collect: boar-meat, count: 2 }
        rewards: { exp: 300, gold: 60 }
        accept-text: 山豬脾氣暴躁，但只要你不惹牠，牠也不會先動手。
        complete-text: 今晚有山豬肉吃了！來，這是你應得的。

      - id: black-bear
        name: 林中霸主
        giver: hunter-li
        level: 6
        requires: [spider-silk-order, boar-feast]
        description: 林子深處的黑熊已經傷了好幾個獵人。老李希望有人能除掉牠。
        objectives:
          - { kill: black-bear, count: 1 }
        rewards: { exp: 700, gold: 150, items: [{ item: hunter-leather }] }
        accept-text: 那頭熊就在林子最北邊。找幾個夥伴一起去，別逞強。
        complete-text: 你真的辦到了……這件獵人皮甲本來是給自己做的，現在它是你的了。

      - id: pelt-trade
        name: 狼皮收購
        giver: hunter-li
        requires: [letter-to-li]
        repeatable: true
        description: 老李長期收購狼皮，價錢比賣給商店還好。
        objectives:
          - { collect: wolf-pelt, count: 3 }
        rewards: { exp: 80, gold: 70 }
        accept-text: 有多少收多少，三張一批。
        complete-text: 成色不錯，下次再來！

    # 技能：由訓練師（friendly 或商人 NPC）教授，學費為銅錢。
    #   type              strike（單體）、aoe（範圍）、heal（治療）、buff（增益）
    #   level / price     學習等級與學費
    #   mp-cost           內力消耗；cooldown-seconds 冷卻秒數（另有 1 秒共用冷卻）
    #   power             strike/aoe：傷害倍率；heal：基礎回復量（另加 power-per-level × 等級）
    #   radius            aoe：範圍（公尺）；heal：可以治療隊友的距離
    #   attack / defense / duration-seconds   buff 的加成與持續時間
    skills:
      - id: power-strike
        name: 重擊
        keywords: [bash, strike]
        description: 把全身的力氣集中在一擊上。
        type: strike
        level: 1
        trainer: village-elder
        price: 10
        mp-cost: 8
        cooldown-seconds: 4
        power: 1.8

      - id: mend
        name: 運氣療傷
        keywords: [heal, mend]
        description: 運轉內力治療傷勢，也能替身邊的同伴療傷。
        type: heal
        level: 2
        trainer: village-elder
        price: 30
        mp-cost: 12
        cooldown-seconds: 8
        power: 20
        power-per-level: 4
        radius: 8

      - id: whirlwind
        name: 旋風斬
        keywords: [whirl, spin]
        description: 原地旋身橫掃，砍中身邊所有的敵人。
        type: aoe
        level: 4
        trainer: hunter-li
        price: 120
        mp-cost: 18
        cooldown-seconds: 10
        power: 0.9
        radius: 3.5

      - id: iron-skin
        name: 鐵布衫
        keywords: [iron, guard]
        description: 運氣護體，刀砍不入——至少比平常耐打得多。
        type: buff
        level: 5
        trainer: hunter-li
        price: 150
        mp-cost: 15
        cooldown-seconds: 30
        defense: 6
        duration-seconds: 20

      - id: tiger-pounce
        name: 猛虎下山
        keywords: [tiger, pounce]
        description: 老李壓箱底的獵熊絕技，一擊之威有如猛虎撲食。
        type: strike
        level: 7
        trainer: hunter-li
        price: 300
        mp-cost: 25
        cooldown-seconds: 12
        power: 2.8

    zones:
      - id: newbie-village
        name: 新手村
        description: 晨霧籠罩著這座寧靜的小村莊，村中央的古井旁站著幾位剛踏上旅途的冒險者。
        size: 60
        spawn: { x: 0, z: 0 }
        # 出口：玩家站在 (x, z) 附近 2.5 公尺內可以通過，抵達 to 區域的 (to-x, to-z)
